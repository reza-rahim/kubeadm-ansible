profile: dev
kube_master_lb: 10.20.0.13

docker_ce_ubuntu: 18.06.2~ce~3-0~ubuntu
docker_ce_redhat: 18.09.9
containerd: 1.2.10

ubunutu_k8_version: 1.15.6-00
redhat_k8_version: 1.15.10-0

##### nginx ingress ########
nginx_ingress_controller_version: 0.29.0
nginx_ingress_controller_replicas: 2
ingress_hostname: www.klovercloud.com
nginx_ingress_http_mgmt: 18080
ingress_limit_cpu: 1000m
ingress_limit_mem: 2Gi
ingress_request_cpu: 1000m
ingress_request_mem: 2Gi


### monitoring ####
cortex_endpoint: http://cortex-nginx.cortex.svc.cluster.local:80/api/prom/push

####### Ceph ######
ceph_mon: 3
osdsPerDevice: 1 # number of OSD per device 

###### cassandra #######
cassandra_endpoint:  cassandra.cassandra.svc.cluster.local
cassandra_replicas: 3
cassandra_storage: 5Gi
cassandra_strorage_class: rook-ceph-block-ec
cassandra_taint: storage 
cassandra_password: admin1234
cassandra_taint: storage
cassandra_limit_cpu: 1000m
cassandra_limit_mem: 500Mi
cassandra_request_cpu: 1000m
cassandra_request_mem: 500Mi
cassandra_max_heap_size: 256M
cassandra_heap_newsize: 100M


