---
# Source: cortex/templates/table-manager-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: cortex-table-manager
  labels:
    chart: cortex-0.0.1
    release: cortex
    heritage: Helm
    cortex: table-manager
spec:
  ports:
    - port: 80
      name: http
      targetPort: http
  selector:
    app: cortex-table-manager
    release: cortex

---
# Source: cortex/templates/table-manager-dep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-table-manager
  labels:
    chart: cortex-0.0.1
    release: cortex
    heritage: Helm
    cortex: table-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-table-manager
      release: cortex
  template:
    metadata:
      labels:
        app: cortex-table-manager
        release: cortex
        cortex: table-manager
      annotations:
        prometheus.io/port: "80"
        prometheus.io/scrape: "true"
        sidecar.istio.io/inject: "false"
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: cortex
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values:
                - cortex
      containers:
      - name: table-manager
        #image: "quay.io/cortexproject/table-manager:master-79bba2f9"
        image: "quay.io/cortexproject/cortex:v0.4.0"
        imagePullPolicy: IfNotPresent
        args:
        - "-target=table-manager"
        - "-server.http-listen-port=80"
        - "-cassandra.addresses=cassandra.cassandra.svc.cluster.local"
        - "-cassandra.auth=true"
        - "-cassandra.password=admin1234"
        - "-cassandra.username=cassandra"
        - "-cassandra.keyspace=cortex"
        - "-cassandra.timeout=1000ms"
        - "-cassandra.replication-factor=2"
        - "-chunk.storage-client=cassandra"
        - "-dynamodb.chunk-table.period=168h0m0s"
        - "-dynamodb.chunk-table.prefix=cortex_chunks_"
        - "-dynamodb.periodic-table.prefix=cortex_weekly_"
        - "-dynamodb.periodic-table.from=2020-01-17"
        - "-dynamodb.daily-buckets-from=2020-01-17"
        - "-dynamodb.base64-buckets-from=2020-01-17"
        - "-dynamodb.v9-schema-from=2020-01-17"
        - "-dynamodb.chunk-table.from=2020-01-17"

        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 200m
          requests:
            cpu: 200m
            memory: 256Mi
