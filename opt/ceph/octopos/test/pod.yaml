---
apiVersion: v1
kind: Pod
metadata:
  name: csirbd-demo-pod-0
spec:
  securityContext:
        runAsUser: 1000
        fsGroup: 2000
  containers:
   - name: web-server
     image: gcr.io/google_containers/echoserver:1.0
     volumeMounts:
       - name: mypvc
         mountPath: /test
  volumes:
   - name: mypvc
     persistentVolumeClaim:
       claimName: rook-ceph-block-pvc
       readOnly: false
