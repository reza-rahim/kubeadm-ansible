---
# Source: cortex/templates/ingester-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: cortex-ingester
  labels:
    chart: cortex-0.0.1
    release: cortex
    heritage: Helm
    cortex: ingester
spec:
  ports:
    - port: 80
      name: http
      targetPort: http
  selector:
    app: cortex-ingester
    release: cortex
---

---
# Source: cortex/templates/ingester-dep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-ingester
  labels:
    chart: cortex-0.0.1
    release: cortex
    heritage: Helm
    cortex: ingester
spec:
  replicas: 3

  # Ingesters are not ready for at least 1 min
  # after creation.  This has to be in sync with
  # the ring timeout value, as this will stop a
  # stampede of new ingesters if we should loose
  # some.
  minReadySeconds: 60

  # Having maxSurge 0 and maxUnavailable 1 means
  # the deployment will update one ingester at a time
  # as it will have to stop one (making one unavailable)
  # before it can start one (surge of zero)
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: cortex-ingester
      release: cortex
  template:
    metadata:
      labels:
        app: cortex-ingester
        release: cortex
        cortex: ingester
      annotations:
        prometheus.io/port: "80"
        prometheus.io/scrape: "true"
        sidecar.istio.io/inject: "false"
    spec:
      # Give ingesters 80 minutes grace to flush chunks and exit cleanly.
      # Service is available during this time, as long as we don't stop
      # too many ingesters at once.
      terminationGracePeriodSeconds: 4800

      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: storage
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values:
                - storage

      containers:
      - name: ingester
        #image: "quay.io/cortexproject/ingester:master-79bba2f9"
        image: quay.io/cortexproject/cortex:v0.4.0
        imagePullPolicy: IfNotPresent
        args:
        - -target=ingester
        - "-config.file=/etc/cortex/config/config.yaml"
        #- -log.level=debug
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 15
          timeoutSeconds: 1
        #resources:
        # limits:
        #   cpu: 4
        # requests:
        #   cpu: 4
        #   memory: 4Gi
        volumeMounts:
        - mountPath: /etc/cortex/config
          name: cortex
      volumes:
        - configMap:
            name: cortex
          name: cortex
