---

- name: Creates /etc/kubernetes/kubeadm/cassandra directory
  file: path=/etc/kubernetes/kubeadm/cassandra  recurse=yes state=directory
  when: >
    groups['kube_master'].index(inventory_hostname) == 0 

- name: Copy kube config files
  template: src="{{ item.src }}" dest="{{ item.dest }}"
  with_items:
     - { src: 'cassandra-statefulset.yaml.j2', dest: '/etc/kubernetes/kubeadm/cassandra/cassandra-statefulset.yaml'  }  
     - { src: 'taint.sh.j2', dest: '/etc/kubernetes/kubeadm/cassandra/taint.sh.j2'  }  
  when: >
    groups['kube_master'].index(inventory_hostname) == 0 
  register: result

- name:  create ns cassandra
  shell: kubectl create ns cassandra;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0 
  ignore_errors: yes

- name: create cassandra db
  shell: kubectl apply -n cassandra -f /etc/kubernetes/kubeadm/cassandra/;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0 
  ignore_errors: yes
