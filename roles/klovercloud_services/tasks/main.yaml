---
  
# copy decriptors

- name: Creates /etc/kubernetes/kubeadm directory
  file: path=/etc/kubernetes/kubeadm/klovercloud/klovercloud_services  recurse=yes state=directory
  when: >
    groups['kube_master'].index(inventory_hostname) == 0  


- name: Copy descriptors
  template: src="{{ item.src }}" dest="{{ item.dest }}"
  with_items:
     - { src: 'step.1.klovercloud-harbor.yaml.j2', dest: '/etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.1.klovercloud-harbor.yaml'  } 
     - { src: 'step.2.listener.yaml.j2', dest: '/etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.2.listener.yaml'  } 
     - { src: 'step.3.management.yaml.j2', dest: '/etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.3.management.yaml'  } 
  when: >
    groups['kube_master'].index(inventory_hostname) == 0  
  register: result

  


# deploy klovercloud harbor


- name:  Deploying KloverCloud Harbor
  shell: kubectl apply -f /etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.1.klovercloud-harbor.yaml;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0   


- name: KloverCloud Harbor - Waiting for pods to come up
  shell: kubectl get pods -l app={{ klovercloud_harbor_deployement_app_label }} -n {{ klovercloud_namespace }} -o json
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  ignore_errors: yes

- name: 
  wait_for:
    timeout: 10

- name: KloverCloud Harbor - Waiting for pods to come up
  shell: kubectl get pods -l app={{ klovercloud_harbor_deployement_app_label }} -n {{ klovercloud_namespace }} -o json
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  ignore_errors: yes

- name: KloverCloud Harbor - Waiting for pods to come up
  shell: while [[ $(kubectl get pods -l app={{ klovercloud_harbor_deployement_app_label }} -n {{ klovercloud_namespace }} -o 'jsonpath={..status.conditions[?(@.type=="Ready")].status}') != "True" ]]; do echo "waiting for pod" && sleep 1; done
  # shell: kubectl wait --for=condition=ready -l "app={{ klovercloud_harbor_deployement_app_label }}" -n {{ klovercloud_namespace }}
  register: kubectl_get_pods

- name: 
  wait_for:
    timeout: 10

# deploy listener

- name:  Deploying KloverCloud Listener
  shell: kubectl apply -f /etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.2.listener.yaml;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0 


- name: KloverCloud Listener - Waiting for pods to come up
  shell: kubectl get pods -l app={{ klovercloud_listener_app_label }} -n {{ klovercloud_namespace }} -o json
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  ignore_errors: yes

- name: 
  wait_for:
    timeout: 30

- name: KloverCloud Listener - Waiting for pods to come up
  shell: kubectl get pods -l app={{ klovercloud_listener_app_label }} -n {{ klovercloud_namespace }} -o json
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  ignore_errors: yes

- name: KloverCloud Listener - Waiting for pods to get ready
  shell: while [[ $(kubectl get pods -l app={{ klovercloud_listener_app_label }} -n {{ klovercloud_namespace }} -o 'jsonpath={..status.conditions[?(@.type=="Ready")].status}') != "True" ]]; do echo "waiting for pod" && sleep 1; done
  register: kubectl_get_pods

- name: Getting klovercloud_super_admin_password from Secret
  shell: kubectl get secret {{ klovercloud_super_admin_secret }} -n {{ klovercloud_namespace }} -o json | jq -r '.data."ADMIN_PASSWORD"'
  register: password

- name: Reseting klovercloud_super_admin_password from Secret
  set_fact:
    klovercloud_super_admin_password: "{{ password.stdout  | b64decode }}"


- name: Login to KloverCloud Listener as Super Admin User
  shell: kubectl -n {{ klovercloud_namespace }} exec -it $(kubectl -n {{ klovercloud_namespace }} get pod -l "app={{ klovercloud_listener_app_label }}" -o jsonpath='{.items[0].metadata.name}') -- bin/sh -c "curl -X POST 'http://localhost:{{ klovercloud_listener_container_port1 }}/api/auth/login'  -H 'Content-Type:application/json'  -d '{\"username\":\"{{ klovercloud_super_admin_username }}\",\"password\":\"{{ klovercloud_super_admin_password }}\"}'"
  register: login_result
  

- name: Reset Login Result
  set_fact:
    login_result: "{{ login_result.stdout | from_json }}"
 

- name: Create an API Access Token for KloverCloud Listener Servie
  shell: kubectl -n {{ klovercloud_namespace }} exec -it $(kubectl -n {{ klovercloud_namespace }} get pod -l "app={{ klovercloud_listener_app_label }}" -o jsonpath='{.items[0].metadata.name}') -- bin/sh -c "curl -X POST 'http://localhost:{{ klovercloud_listener_container_port1 }}/api/api-access-token'  -H 'Content-Type:application/json' -H 'x-auth-token:{{ login_result.token }}' -d '{}'"
  register: api_access_token
  ignore_errors: yes


- name: Reset Create API Access Token Result
  set_fact:
    api_access_token: "{{ api_access_token.stdout | from_json }}"
  ignore_errors: yes

- name: Reset KloverCloud Listener API Access Token
  set_fact:
    klovercloud_listener_api_access_token: "{{ api_access_token.data }}"
  ignore_errors: yes
  # when: api_access_token.json.success == true


- name: Copy Secret Descriptors
  template: src="{{ item.src }}" dest="{{ item.dest }}"
  with_items:
     - { src: 'step.2.1.secret.yaml.j2', dest: '/etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.2.1.secret.yaml'  } 
  when: >
    groups['kube_master'].index(inventory_hostname) == 0  
  register: result

- name:  Applying Secrets
  shell: kubectl apply -f /etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.2.1.secret.yaml;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0


# deploy management

- name:  Deploying KloverCloud Management
  shell: kubectl apply -f /etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.3.management.yaml;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0

- name: KloverCloud Management - Waiting for pods to come up
  shell: kubectl get pods -n {{ klovercloud_namespace }} -o json
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]

