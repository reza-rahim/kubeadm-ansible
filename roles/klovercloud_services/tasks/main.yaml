# Create rados admin user

- name: 
  shell: kubectl -n {{ klovercloud_rook_ceph_namespace }} exec -it $(kubectl -n {{ klovercloud_rook_ceph_namespace }} get pod -l "app=rook-ceph-tools" -o jsonpath='{.items[0].metadata.name}') -- bash -c 'radosgw-admin user create --uid={{ klovercloud_rook_ceph_object_storage_user_id }} --display-name={{ klovercloud_rook_ceph_object_storage_user_display_name }} --access-key={{ klovercloud_rook_ceph_object_storage_access_key }} --secret-key={{ klovercloud_rook_ceph_object_storage_secret_key }} &&  radosgw-admin --id admin caps add --caps="buckets=*;users=*;usage=*;metadata=*" --uid={{ klovercloud_rook_ceph_object_storage_user_id }}'

