- name: Copy KloverCloud Facade Descriptors
  template: src="{{ item.src }}" dest="{{ item.dest }}"
  with_items:
      - { src: 'step.4.facade.yaml.j2', dest: '/etc/kubernetes/kubeadm/klovercloud/klovercloud_services/step.4.facade.yaml'  } 
