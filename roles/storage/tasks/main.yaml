---

- name: Creates /etc/kubernetes/kubeadm directory
  file: path=/etc/kubernetes/kubeadm/storage  recurse=yes state=directory
  when: >
    groups['kube_master'].index(inventory_hostname) == 0    

- name: Copy kube config files
  template: src="{{ item.src }}" dest="{{ item.dest }}"
  with_items:
     - { src: 'step.1.common.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.1.common.yaml'  }  
     - { src: 'step.2.operator.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.2.operator.yaml'  }  
     - { src: 'step.3.cluster.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.3.cluster.yaml'  }  
     - { src: 'step.4.object.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.4.object.yaml'  }  
     - { src: 'step.5.object-user.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.5.object-user.yaml'  }  
     - { src: 'step.6.toolbox.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.6.toolbox.yaml'  }  
     - { src: 'step.7.StorageClass.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.7.StorageClass.yaml'  }  
     #- { src: 'step.8.StorageClassEC.yaml.j2', dest: '/etc/kubernetes/kubeadm/storage/step.8.StorageClassEC.yaml'  }  
     - { src: 'taint.sh.j2', dest: '/etc/kubernetes/kubeadm/storage/taint.sh'  }  
  when: >
    groups['kube_master'].index(inventory_hostname) == 0    
  register: result

- name:  label and storage ingress box
  shell: sh /etc/kubernetes/kubeadm/storage/taint.sh;
  when: >
    groups['kube_master'].index(inventory_hostname) == 0    
  ignore_errors: yes

- name: creating ceph cluster ... 
  shell: kubectl apply -f /etc/kubernetes/kubeadm/storage/step.1.common.yaml; sleep 15; \
         kubectl apply -f /etc/kubernetes/kubeadm/storage/step.2.operator.yaml; sleep 15; \ 
         kubectl apply -f /etc/kubernetes/kubeadm/storage/step.3.cluster.yaml; sleep 15;  \
         kubectl apply -f /etc/kubernetes/kubeadm/storage/step.4.object.yaml; sleep 5; \
         kubectl apply -f /etc/kubernetes/kubeadm/storage/step.5.object-user.yaml; sleep 5; \ 
         kubectl apply -f /etc/kubernetes/kubeadm/storage/step.6.toolbox.yaml; sleep 5;  
  when: >
    groups['kube_master'].index(inventory_hostname) == 0    
  ignore_errors: yes

- name: creating storage class ...
  shell: kubectl apply -f /etc/kubernetes/kubeadm/storage/step.7.StorageClass.yaml; 
